<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)" />

  <!-- Grid decoration -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  <!-- Glowing Shapes -->
  <circle cx="150" cy="150" r="100" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="150" r="120" fill="#f472b6" opacity="0.1" filter="url(#glow)" />

  <!-- Title & Subtitle -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="125" font-size="52" font-weight="900" fill="url(#accent)" letter-spacing="1">
      Awesome Application Frameworks 🚀
    </text>
    <text x="600" y="175" font-size="22" font-weight="400" fill="#e2e8f0" letter-spacing="0.5">
      Curated Ecosystem of Web, Backend, Full-Stack &amp; Enterprise Frameworks
    </text>
    
    <!-- Pills/Badges in SVG -->
    <g transform="translate(370, 210)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#334155" opacity="0.8"/>
      <text x="60" y="21" font-size="14" font-weight="600" fill="#38bdf8">Web &amp; API</text>
      
      <rect x="135" y="0" width="140" height="32" rx="16" fill="#334155" opacity="0.8"/>
      <text x="205" y="21" font-size="14" font-weight="600" fill="#a78bfa">Enterprise JVM</text>
      
      <rect x="290" y="0" width="170" height="32" rx="16" fill="#334155" opacity="0.8"/>
      <text x="375" y="21" font-size="14" font-weight="600" fill="#f472b6">Python &amp; JavaScript</text>
    </g>
  </g>
</svg>
