<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1035" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Animated Floating Orbs in Background */
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -20px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, 25px) scale(1.2); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes pulseGrid {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.12; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-1 { animation: floatOrb1 10s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: floatOrb2 12s ease-in-out infinite; transform-origin: center; }
    .grid-lines { animation: pulseGrid 6s ease-in-out infinite; }
    .animated-flow { stroke-dasharray: 20 10; animation: flowLine 15s linear infinite; }
  </style>

  <!-- Base Card Container -->
  <rect width="1200" height="340" rx="20" fill="url(#bg)" />

  <!-- DYNAMIC BACKGROUND LAYER (Behind Content) -->
  <g class="grid-lines" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Floating Glowing Orbs (Dynamic Background) -->
  <g>
    <circle class="orb-1" cx="180" cy="170" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="170" r="140" fill="#c084fc" opacity="0.14" filter="url(#glow)" />
  </g>

  <!-- Animated Data Flow / Connection Waves in Background -->
  <path class="animated-flow" d="M -50 280 Q 300 200 600 280 T 1250 260" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" />
  <path class="animated-flow" d="M -50 70 Q 300 130 600 70 T 1250 90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />

  <!-- FOREGROUND CONTENT LAYER (Guaranteed clear visibility) -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Title -->
    <text x="600" y="130" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="1">
      Awesome Application Frameworks 🚀
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="182" font-size="22" font-weight="400" fill="#cbd5e1" letter-spacing="0.5">
      Curated Ecosystem of Web, Backend, Full-Stack &amp; Enterprise Frameworks
    </text>

    <!-- Foreground Feature Badges/Pills -->
    <g transform="translate(325, 225)">
      <!-- Pill 1 -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="160" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="80" y="24" font-size="14" font-weight="600" fill="#38bdf8">🌐 Web &amp; APIs</text>
      </g>
      
      <!-- Pill 2 -->
      <g transform="translate(185,0)">
        <rect x="0" y="0" width="180" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="90" y="24" font-size="14" font-weight="600" fill="#a78bfa">☕ Enterprise JVM</text>
      </g>
      
      <!-- Pill 3 -->
      <g transform="translate(385,0)">
        <rect x="0" y="0" width="160" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="80" y="24" font-size="14" font-weight="600" fill="#f472b6">⚡ High Star repos</text>
      </g>
    </g>
  </g>
</svg>
